<!doctype html>
<html lang="en" data-scnx-theme="scnx-saas" data-scnx-resolved-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scnehaux UI reference</title>
<!-- Viewer for the component reference. Serve this folder over HTTP (for example
     `npx serve .` at the repository root); browsers block fetch() from file:// pages. Each card's
     preview.html is loaded as a theme root (data-scnx-theme, data-scnx-resolved-mode) with
     @scnx/system's tokens/css/<theme>.css, synced into vendor/scnx-system/, and
     components/bundle.css. Components and rules are shared; a theme only supplies values. -->
<link id="tokens" rel="stylesheet" href="vendor/scnx-system/tokens/css/scnx-saas.css">
<style>
  :root { color-scheme: light dark; --font-sans: Inter, -apple-system, Arial, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif; font-feature-settings: "cv11" 1;
    background: var(--ds-color-neutral-surface-default-default); color: var(--ds-color-neutral-text-default-default);
  }
  header {
    position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--ds-color-neutral-surface-canvas-default);
    box-shadow: inset 0 -1px 0 var(--ds-color-neutral-border-subtle-default);
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 auto 0 0; letter-spacing: -0.01em; }
  select, input { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--ds-color-neutral-border-strong-default); background: var(--ds-color-neutral-surface-raised-default); color: inherit; }
  main { display: grid; gap: 16px; padding: 16px; max-width: 992px; margin: 0 auto; }
  section { border-radius: 16px; overflow: hidden; background: var(--ds-color-neutral-surface-canvas-default); box-shadow: 0 0 0 1px var(--ds-color-neutral-border-subtle-default); }
  section h2 { margin: 0; padding: 10px 16px; font: 500 11px/1.4 ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ds-color-neutral-text-subtle-default); box-shadow: inset 0 -1px 0 var(--ds-color-neutral-border-subtle-default); }
  section h2 a { color: inherit; }
  iframe { display: block; inline-size: 100%; border: 0; }
  p.note { margin: 0; padding: 16px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Scnehaux UI reference</h1>
  <input id="filter" type="search" placeholder="Filter components" aria-label="Filter components">
  <select id="theme" aria-label="Theme and mode">
    <option value="scnx-saas/light">scnx-saas · Light</option>
    <option value="scnx-saas/dark">scnx-saas · Dark</option>
    <option value="scnx-platform/light">scnx-platform · Light</option>
    <option value="scnx-platform/dark">scnx-platform · Dark</option>
  </select>
</header>
<main id="cards"></main>
<script type="module">
  const NAMES = ["Cover", "Accordion", "Alert", "Avatar", "Badge", "Breadcrumb", "Button", "Checkbox", "Code", "CodeSelect", "CodeShowcase", "Dialog", "Divider", "EdgeLayout", "FloatingLayout", "Heading", "IconButton", "Kbd", "Link", "List", "Menu", "Navbar", "Navigation", "Pagination", "Popover", "Progress", "Radio", "SegmentedControl", "Select", "Sheet", "Sidebar", "Skeleton", "Spinner", "Surface", "Switch", "Table", "TableOfContents", "Tabs", "Text", "TextField", "Textarea", "Toast", "Tooltip"];
  const main = document.getElementById("cards");
  const theme = document.getElementById("theme");
  const filter = document.getElementById("filter");
  const params = new URLSearchParams(location.search);
  // links made before the themes were renamed say default/<mode>; that look is now scnx-saas
  theme.value = (params.get("theme") ?? "scnx-saas/light").replace(/^default\//, "scnx-saas/");
  if (!theme.value) theme.value = "scnx-saas/light";
  const base = new URL(".", location.href).href;
  const sources = new Map();
  try {
    await Promise.all(NAMES.map(async (name) => {
      const res = await fetch(`components/${name}/preview.html`);
      if (!res.ok) throw new Error(`${name}: ${res.status}`);
      sources.set(name, await res.text());
    }));
  } catch (error) {
    main.innerHTML = `<section><p class="note">The previews could not be loaded (${String(error.message)}). Serve this folder over HTTP, for example <code>npx serve .</code> at the repository root, or open the PNGs in <code>rendered/&lt;theme&gt;/</code>.</p></section>`;
    throw error;
  }
  const tokens = (id) => `vendor/scnx-system/tokens/css/${id}.css`;
  const head = (id) => `<base href="${base}components/x/"><link rel="stylesheet" href="${base}${tokens(id)}"><link rel="stylesheet" href="${base}components/bundle.css"><style>:root{--font-sans:Inter,-apple-system,Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>`;
  function render() {
    const [id, mode] = theme.value.split("/");
    document.getElementById("tokens").href = tokens(id);
    Object.assign(document.documentElement.dataset, { scnxTheme: id, scnxResolvedMode: mode });
    const q = filter.value.trim().toLowerCase();
    main.replaceChildren();
    for (const name of NAMES) {
      if (q && !name.toLowerCase().includes(q)) continue;
      const html = sources.get(name);
      const height = Number(/height=(\d+)/.exec(html)?.[1] ?? 160);
      const section = document.createElement("section");
      section.innerHTML = `<h2><a href="components/${name}/README.md">${name}</a></h2>`;
      const frame = document.createElement("iframe");
      frame.title = `${name} preview`;
      frame.style.blockSize = `${height}px`;
      frame.srcdoc = html.replace("<html", `<html data-scnx-theme="${id}" data-scnx-resolved-mode="${mode}"`).replace("<head>", `<head>${head(id)}`);
      section.append(frame);
      main.append(section);
    }
  }
  theme.addEventListener("change", () => { params.set("theme", theme.value); history.replaceState(null, "", `?${params}`); render(); });
  filter.addEventListener("input", render);
  render();
</script>
</body>
</html>
