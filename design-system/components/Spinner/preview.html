<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinner</title>
<style>
html,body{margin:0}body{background:var(--ds-color-neutral-surface-canvas-default)}
.pv{padding:var(--ds-dimension-spacing-inset-comfortable);display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-comfortable)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--ds-dimension-spacing-inline-default)}
.col{display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-default)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ds-dimension-spacing-inset-comfortable)}
.muted{color:var(--ds-color-neutral-text-subtle-default);font-size:var(--ds-typography-body-small-font-size)}
body.scnx-stage{min-block-size:100vh}

</style>
</head>
<body>
<div class="pv"><div class="row" style="gap:var(--ds-dimension-spacing-inset-comfortable)"><span class="scnx-spinner" role="status" aria-label="Loading"></span><span class="scnx-spinner" data-size="medium" role="status" aria-label="Loading"></span><span class="scnx-spinner" data-size="large" role="status" aria-label="Loading"></span><button class="scnx-btn" data-variant="primary" data-size="medium" aria-busy="true"><span class="scnx-spinner" aria-hidden="true" style="color:inherit;border-color:var(--ds-color-neutral-text-contrast-disabled);border-block-start-color:currentColor"></span>Deploying</button></div></div>
</body>
</html>
