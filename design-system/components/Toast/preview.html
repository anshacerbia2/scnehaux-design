<!-- @dsCard group="Feedback" height=250 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast</title>
<style>
html,body{margin:0}body{background:var(--ds-color-neutral-surface-canvas-default)}
.pv{padding:var(--ds-dimension-spacing-inset-comfortable);display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-comfortable)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--ds-dimension-spacing-inline-default)}
.col{display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-default)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ds-dimension-spacing-inset-comfortable)}
.muted{color:var(--ds-color-neutral-text-subtle-default);font-size:var(--ds-typography-body-small-font-size)}
body.scnx-stage{min-block-size:100vh}

</style>
</head>
<body class="scnx-stage">
<div class="pv" style="align-items:flex-end;padding:var(--ds-dimension-spacing-inset-comfortable)">
  <div class="scnx-toast" data-scheme="success" role="status"><span data-part="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16 9.6"/></svg></span><div><div data-part="title">Deployed to production</div><div data-part="body">acme-dashboard · 41s · commit 8259d6e</div><div data-part="actions"><button class="scnx-btn" data-variant="secondary" data-size="small">Visit</button><button class="scnx-btn" data-variant="ghost" data-size="small">Undo</button></div></div><button class="scnx-icon-btn" data-variant="ghost" data-size="small" aria-label="Dismiss"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="scnx-toast" data-scheme="danger" role="alert"><span data-part="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></span><div><div data-part="title">Domain verification failed</div><div data-part="body">Add the TXT record and try again.</div></div><button class="scnx-icon-btn" data-variant="ghost" data-size="small" aria-label="Dismiss"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
</div>
</body>
</html>
