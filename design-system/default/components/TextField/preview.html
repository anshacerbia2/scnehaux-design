<!-- @dsCard group="Forms" height=290 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextField</title>
<style>
html,body{margin:0}body{background:var(--ds-color-neutral-surface-canvas-default)}
.pv{padding:var(--ds-dimension-spacing-inset-comfortable);display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-comfortable)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--ds-dimension-spacing-inline-default)}
.col{display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-default)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ds-dimension-spacing-inset-comfortable)}
.muted{color:var(--ds-color-neutral-text-subtle-default);font-size:var(--ds-typography-body-small-font-size)}
body.scnx-stage{min-block-size:100vh}

</style>
</head>
<body>
<div class="pv"><div class="grid2">
  <div class="scnx-text-field"><label data-part="label" for="tf1">Project name</label><input data-part="input" id="tf1" placeholder="acme-dashboard"><p data-part="description">Lowercase letters, numbers and hyphens.</p></div>
  <div class="scnx-text-field"><label data-part="label" for="tf2">Domain</label><input data-part="input" id="tf2" value="acme.scnx.app"></div>
  <div class="scnx-text-field" data-invalid><label data-part="label" for="tf3">Email</label><input data-part="input" id="tf3" value="ana@acme" aria-invalid="true" aria-describedby="tf3e"><p data-part="error" id="tf3e"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Enter a full email address.</p></div>
  <div class="scnx-text-field"><label data-part="label" for="tf4">Region</label><input data-part="input" id="tf4" value="Jakarta (ap-southeast-3)" disabled></div>
</div></div>
</body>
</html>
