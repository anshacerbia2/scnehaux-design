<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SegmentedControl</title>
<style>
html,body{margin:0}body{background:var(--ds-color-neutral-surface-canvas-default)}
.pv{padding:var(--ds-dimension-spacing-inset-comfortable);display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-comfortable)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--ds-dimension-spacing-inline-default)}
.col{display:flex;flex-direction:column;gap:var(--ds-dimension-spacing-stack-default)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ds-dimension-spacing-inset-comfortable)}
.muted{color:var(--ds-color-neutral-text-subtle-default);font-size:var(--ds-typography-body-small-font-size)}
body.scnx-stage{min-block-size:100vh}

</style>
</head>
<body>
<div class="pv"><div class="row" style="gap:var(--ds-dimension-spacing-inset-comfortable)">
  <div class="scnx-segmented" role="radiogroup" aria-label="Range"><button data-part="item" role="radio" aria-checked="false">24h</button><button data-part="item" role="radio" aria-checked="true">7 days</button><button data-part="item" role="radio" aria-checked="false">30 days</button><button data-part="item" role="radio" aria-checked="false">90 days</button></div>
  <div class="scnx-segmented" role="radiogroup" aria-label="Theme"><button data-part="item" role="radio" aria-checked="false" aria-label="Light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button data-part="item" role="radio" aria-checked="true" aria-label="System"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button><button data-part="item" role="radio" aria-checked="false" aria-label="Dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
  <div class="scnx-segmented" data-size="small" role="radiogroup" aria-label="View"><button data-part="item" role="radio" aria-checked="true">Grid</button><button data-part="item" role="radio" aria-checked="false">List</button></div>
</div></div>
</body>
</html>
